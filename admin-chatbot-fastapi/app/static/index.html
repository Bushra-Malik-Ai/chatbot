<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directory — Admin Chat</title>
<style>
  :root{
    --ink:#12181f; --paper:#f6f4ee; --paper-2:#ffffff; --line:#dcd7ca;
    --accent:#3a6b5c; --text:#1c242e; --text-dim:#6b7178; --danger:#b3462c;
    --mono: "SFMono-Regular", Consolas, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--text); font-family:var(--sans);
        min-height:100vh; display:flex; justify-content:center; }
  .app{ width:100%; max-width:1160px; padding:28px 20px 40px; }
  .login-shell{ min-height:80vh; display:flex; align-items:center; justify-content:center; }
  .login-card{ width:100%; max-width:380px; background:var(--paper-2); border:1px solid var(--line);
               border-radius:4px; padding:36px 32px; }
  .login-mark{ font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--accent); margin-bottom:18px;}
  .login-card h1{ font-size:22px; margin:0 0 6px; font-weight:600;}
  .login-card p{ color:var(--text-dim); font-size:14px; margin:0 0 22px; line-height:1.5;}
  .field-label{ font-size:12px; color:var(--text-dim); margin-bottom:6px; display:block;}
  input[type="email"], input[type="text"]{ width:100%; padding:10px 12px; font-size:14px;
      border:1px solid var(--line); border-radius:3px; background:var(--paper); color:var(--text); font-family:var(--sans);}
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .login-btn{ margin-top:16px; width:100%; padding:11px; background:var(--accent); color:#fff; border:none;
      border-radius:3px; font-size:14px; font-weight:600; cursor:pointer;}
  .login-btn:hover{ background:#2f5749; }
  .login-error{ margin-top:12px; font-size:13px; color:var(--danger); min-height:16px;}
  .login-hint{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--text-dim); line-height:1.6;}
  .login-hint code{ font-family:var(--mono); background:var(--paper); padding:1px 5px; border-radius:2px;}
